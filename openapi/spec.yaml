openapi: 3.1.0
info:
  title: NP Backend OpenAPI spec
  version: 0.1.0
paths:
  /properties:
      get:
        summary: Get list of properties
        responses:
          '200':
            description: Properties fetched successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      type: boolean
                      example: true
                    message:
                      type: string
                      example: Properties fetched successfully.
                    status:
                      type: integer
                      example: 200
                    data:
                      type: object
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '#/components/schemas/PropertyListItemSchema'
                        page:
                          type: integer
                          example: 1
                        has_next:
                          type: boolean
                          example: false
                        total:
                          type: integer
                          example: 4
                examples:
                  example:
                    value:
                      success: true
                      message: Properties fetched successfully.
                      status: 200
                      data:
                        list:
                          - id: 78
                            property_details: []
                            realtor_property_id: 89
                            has_disclosures: true
                            offers: []
                            additional_information: "property_additional_information"
                            address: "1458 Miloiki Street"
                            city: "Honolulu"
                            county_or_parish: "Oahu"
                            created_at: "2025-05-28T13:25:39.950213Z"
                            deadline_datetime: null
                            has_unread_messages: false
                            image: "https://imagecdn.realty.com/photos/bluestack/1019520412/1.jpg?w=500"
                            is_deadline_checked: false
                            is_property_viewed_by_client: false
                            latitude: 21.308506
                            listing_id: 1019520412
                            longitude: -157.682219
                            name: "Jeffrey N Samuels"
                            no_of_baths: 2
                            no_of_beds: 3
                            note: ""
                            open_house_time: null
                            price: 825000
                            redfin_url: null
                            square_feet_size: 2406
                            state_or_province: "HI"
                            tag: null
                            updated_at: "2025-05-28T13:25:39.950225Z"
                            zillow_url: null
                            zip_code: "96825"
                        page: 1
                        has_next: false
                        total: 4
          '400':
            description: "Bad Request (e.g., if realtor_property_id is provided but invalid format)."
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/error'
          '401':
            description: Authentication credentials were not provided or are invalid.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/error'
          '403':
            description: Permission denied.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/error'
          '404':
            description: Property not found with the given ID.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/error'
                  example:
                    success: false
                    message: Property not found.
                    code: not_found
                    status: 404
                    data: {}
      security:
        - auth_key: []
  /properties/details/{property_id}:
    get:
      summary: Get details of a specific property
      operationId: getPropertyDetailsById
      tags:
        - Properties
      parameters:
        - name: property_id
          in: path
          required: true
          description: Numeric ID of the property to retrieve.
          schema:
            type: integer
            example: 1
        - name: realtor_property_id
          in: query
          required: false
          description: "Optional RealtorProperty ID, used for context (e.g., fetching specific offers, disclosures, comparables related to a realtor-client interaction with this property)."
          schema:
            type: integer
            example: 101
      responses:
        '200':
          description: Property details fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Property details fetched successfully.
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/PropertyDetailsDataSchema'
        '400':
          description: "Bad Request (e.g., if realtor_property_id is provided but invalid format)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Property not found with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
                example:
                  success: false
                  message: Property not found.
                  code: not_found
                  status: 404
                  data: {}
      security:
        - auth_key: []
  /user/client:
    get:
      summary: List clients for the realtor
      operationId: listClients
      tags:
        - Client Management
      parameters:
        - name: search
          in: query
          required: false
          description: Search term for client name or email
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for pagination
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of items per page
          schema:
            type: integer
            default: 10
        - name: active
          in: query
          required: false
          description: Filter by active status (true or false)
          schema:
            type: boolean
      responses:
        '200':
          description: Clients fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  status:
                    type: integer
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            email:
                              type: string
                              format: email
                            phone:
                              type: string
                            propertiesCount:
                              type: integer
                            lastActivity:
                              type: string
                              format: date-time
                              example: "2024-03-20T10:30:00Z"
                      page:
                        type: integer
                      has_next:
                        type: boolean
                      total:
                        type: integer
              examples:
                active_clients:
                  summary: Response when 'active=true'
                  value:
                    success: true
                    message: Clients fetched successfully.
                    status: 200
                    data:
                      list:
                        - id: "101"
                          name: "Active Client Alice"
                          email: "alice.active@example.com"
                          phone: "1110001111"
                          propertiesCount: 5
                          lastActivity: "2024-03-20T10:30:00Z"
                        - id: "102"
                          name: "Active Client Bob"
                          email: "bob.active@example.com"
                          phone: "2220002222"
                          propertiesCount: 2
                          lastActivity: "2024-03-20T10:30:00Z"
                      page: 1
                      has_next: false
                      total: 2
                inactive_clients:
                  summary: Response when 'active=false'
                  value:
                    success: true
                    message: Clients fetched successfully.
                    status: 200
                    data:
                      list:
                        - id: "201"
                          name: "Inactive Client Charles"
                          email: "charles.inactive@example.com"
                          phone: "3330003333"
                          propertiesCount: 1
                          lastActivity: "2024-03-20T10:30:00Z"
                      page: 1
                      has_next: false
                      total: 1
                all_clients:
                  summary: Response when 'active' parameter is not provided
                  value:
                    success: true
                    message: Clients fetched successfully.
                    status: 200
                    data:
                      list:
                        - id: "101"
                          name: "Active Client Alice"
                          email: "alice.active@example.com"
                          phone: "1110001111"
                          propertiesCount: 5
                          lastActivity: "2024-03-20T10:30:00Z"
                        - id: "102"
                          name: "Active Client Bob"
                          email: "bob.active@example.com"
                          phone: "2220002222"
                          propertiesCount: 2
                          lastActivity: "2024-03-20T10:30:00Z"
                        - id: "201"
                          name: "Inactive Client Charles"
                          email: "charles.inactive@example.com"
                          phone: "3330003333"
                          propertiesCount: 1
                          lastActivity: "2024-03-20T10:30:00Z"
                      page: 1
                      has_next: false
                      total: 3
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Permission denied (e.g., authenticated user is not a realtor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
        - auth_key: []
    post:
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Any Name"
                last_name:
                  type: string
                  example: ""
                email:
                  type: string
                  format: email
                  example: "anyname@example.com"
                phone:
                  type: integer # Note: Your ClientPostRequestSerializer expects phone as string and validates 10 digits. Consider changing this example to string "1234567890"
                  example: 3489032
              required:
                - first_name
                - phone
      responses:
        '200': # Your view returns 200 OK on successful creation
          description: Client created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Client created successfully
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object # Based on ClientPostResponseData structure
                    properties:
                      parent:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: "Any Name" # Assuming first_name from request becomes name
                          email:
                            type: string
                            format: email
                            example: "anyname@example.com"
                          phone:
                            type: string # Should match ClientResponseSchema
                            example: "03489032" # Assuming this if input is integer and gets padded/formatted
                          property_count:
                            type: integer
                            example: 0
                      members:
                        type: array
                        items: {} # Empty array if no members created by default in this example
                        example: []
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
        - auth_key: []
  /user/client-details/{client_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        description: Numeric ID of the client to fetch details for.
        schema:
          type: integer
    get:
      summary: Get details of a specific client, including their family members
      operationId: getClientDetailsById
      tags:
        - Client Management
      responses:
        '200':
          description: Client details fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Client details fetched successfully.
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: "Parent Client Name"
                      email:
                        type: string
                        format: email
                        example: "parent@example.com"
                      phone:
                        type: string
                        example: "0987654321"
                      members:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 2
                            name:
                              type: string
                              example: "Family Member"
                            email:
                              type: string
                              format: email
                              example: "member@example.com"
                            phone:
                              type: string
                              example: "1122334455"
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Permission denied (e.g., authenticated user is not a realtor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Client not found with the given ID, or client does not belong to the authenticated realtor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
        - auth_key: []                          
  /user/client/{id}:
    put:
      summary: Update an existing client
      operationId: updateClient
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the client to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - phone
              properties:
                first_name:
                  type: string
                  example: Any Name
                last_name:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: anyname@example.com
                phone:
                  type: integer
                  example: 9876543210
      responses:
        '200':
          description: Client updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Client created successfully
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      client:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          first_name:
                            type: string
                            example: Any Name
                          last_name:
                            type: string
                            example: Doe
                          email:
                            type: string
                            example: anyname@example.com
                          phone:
                            type: integer
                            example: 9876543210    
  /user/client/{id}:
    delete:
      summary: Delete a client
      description: Deletes a client by ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the client to delete
          schema:
            type: integer
            example: 7
      responses:
        '200':
          description: Client deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Client created successfully
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    example: {}
        '404':
          description: Client not found
        '500':
          description: Server error                    
  /campaign/{campaign_code}/login:
    post:
      summary: Campaign login
      parameters:
        - name: campaign_code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email for login attempt
                phone_number:
                  type: string
                  description: Email for login attempt
                auth_id:
                  type: string
                  description: Email for login attempt
                otp:
                  type: string
                  description: Password for login attempt
      responses:
        '200':
          description: Credentials are correct
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  status:
                    type: number
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                      auth_token:
                        type: string
                      user_type:
                        type: string
                        enum: [realtor, user]
                        description: Type of user (realtor or user)
              examples:
                example:
                  value:
                    success: true
                    message: User logged in successfully.
                    status: 200
                    data:
                      username: user1
                      first_name: Some
                      last_name: Name
                      email: user1@example.example
                      auth_token: abcd1234
                      user_type: realtor
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                example:
                  value:
                    success: false
                    code: request_invalid
                    message: Request is invalid.
                    status: 400
                    data: {}
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                example:
                  value:
                    success: false
                    code: invalid_credentials
                    message: Invalid credentials.
                    status: 401
                    data: {}
      description: Log in as a campaign employee
  /user/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email for login attempt
                password:
                  type: string
                  description: Password for login attempt
                coach:
                  type: boolean
                  default: false
              required:
                - email
                - password
      responses:
        '200':
          description: Credentials are correct
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  status:
                    type: number
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                      auth_token:
                        type: string
                      user_type:
                        type: string
                        enum: [realtor, user]
                        description: Type of user (realtor or user)
              examples:
                example:
                  value:
                    success: true
                    message: User logged in successfully.
                    status: 200
                    data:
                      username: user1
                      first_name: Some
                      last_name: Name
                      email: user1@example.example
                      auth_token: abcd1234
                      user_type: realtor
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                example:
                  value:
                    success: false
                    code: request_invalid
                    message: Request is invalid.
                    status: 400
                    data: { }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                example:
                  value:
                    success: false
                    code: invalid_credentials
                    message: Invalid credentials.
                    status: 401
                    data: { }
        '403':
          description: Credentials correct but user has to change password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                example:
                  value:
                    success: false
                    code: must_change_password
                    message: Please change your password.
                    status: 403
                    data: { }
      description: Log in to an existing account
  /user/logout:
    post:
      operationId: user_logout_create
      description: Logout an active session or invalidate a PAT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email of the user logging out
                token:
                  type: string
                  description: The PAT to invalidate
              required:
                - token
      responses:
        '200':
          description: Logged out successfully or PAT invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  status:
                    type: integer
                  data:
                    type: object
                    additionalProperties: true
                examples:
                  example:
                    success: true
                    message: User logged out successfully or PAT invalidated.
                    status: 200
                    data: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                examples:
                  example:
                    detail: Invalid token or unauthorized access.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                examples:
                  example:
                    detail: An unexpected error occurred.
      tags:
        - user
      security:
        - auth_key: []    
  /user/sign-up:
    post:
      operationId: user_sign-up_create
      description: Sign up new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
              required:
                - email
                - password
                - first_name
                - last_name
            examples:
              example:
                value:
                  email: admin@gmail.com
                  password: '123456'
                  first_name: John
                  last_name: Doe
      responses:
        '200':
          description: User successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  status:
                    type: integer
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                      auth_token:
                        type: string
              examples:
                example:
                  value:
                    success: true
                    message: User successfully created.
                    status: 200
                    data:
                      username: user1
                      first_name: Some
                      last_name: Name
                      email: user1@example.example
                      auth_token: abcd1234
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  code:
                    type: string
                  status:
                    type: integer
                  data:
                    type: object
                    properties: { }
              examples:
                example:
                  value:
                    success: false
                    message: Email already exists.
                    code: email_already_exists
                    status: 401
                    data: { }
  /user/logout:
    post:
      operationId: user_logout_create
      description: Logout an active session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string                     
      responses:
        '200':
          description: Logged out successfuly
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    additionalProperties: true
                examples:
                  example:
                    success: true
                    message: User logged out successfully.
                    status: 200
                    data: { }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                examples:
                  example:
                    detail: Invalid token
      tags:
        - user
      security:
        - auth_key: [ ]
  /survey/{id}:
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
    delete:
      summary: Delete user survey
      responses:
        '200':
          description: User Survey deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  status:
                    type: number
                  data:
                    type: object
              examples:
                example:
                  value:
                    success: true
                    message: Survey deleted successfully.
                    status: 200
                    data: { }
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                example:
                  value:
                    success: false
                    code: request_invalid
                    message: Request is invalid.
                    status: 400
                    data: { }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
