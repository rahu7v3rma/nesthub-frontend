                $ref: '#/components/schemas/error'
        '401':
          description: Authentication credentials were not provided or are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Offer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
        - auth_key: []
    delete:
      summary: Delete an offer
      description: Deletes a specific offer from the property by offer ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the offer to delete
          schema:
            type: string
      responses:
        '200':
          description: Offer deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Offer deleted successfully.
                  status:
                    type: integer
                    example: 200
                  data:
                    type: object
                    example: {}
        '401':
          description: Authentication credentials were not provided or are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Offer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
        - auth_key: []
